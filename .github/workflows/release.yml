name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            race: "false"
            suffix: amd64
          - arch: arm64
            platform: linux/arm64
            race: "false"
            suffix: arm64
          - arch: amd64
            platform: linux/amd64
            race: "true"
            suffix: race-amd64
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.suffix }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/vitistack/gslb-operator:${{ github.ref_name }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ github.ref_name }}
            DATE=${{ steps.date.outputs.DATE }}
            RACE=${{ matrix.race }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}.txt

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/${{ matrix.suffix }}.txt
          retention-days: 1

  create-oci-image:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create multi-arch manifests
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/vitistack/gslb-operator
        run: |
          set -eux
          amd64_digest=$(cat /tmp/digests/amd64.txt)
          arm64_digest=$(cat /tmp/digests/arm64.txt)
          race_amd64_digest=$(cat /tmp/digests/race-amd64.txt)

          tags=(-t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION#v}")
          # only float "latest" for full releases, not -rc/-staging prerelease tags
          case "$VERSION" in
            *-*) ;;
            *) tags+=(-t "${IMAGE}:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}@${amd64_digest}" "${IMAGE}@${arm64_digest}"

          docker buildx imagetools create -t "${IMAGE}:${VERSION}-race" \
            "${IMAGE}@${race_amd64_digest}"
