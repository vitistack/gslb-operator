services:
#  git-sync:
#    image: registry.k8s.io/git-sync/git-sync:v4.0.0
#    env_file:
#      - .gitsync.env
#    volumes:
#      - ./policies:/policies
  opa:
    image: openpolicyagent/opa:0.60.0
    profiles:
      - opa
      - all
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--watch"
      - "/gslb-policies/policies/"
      - "/gslb-policies/data/"
    ports: 
      - "8181:8181"
    volumes:
      - ./gslb-policies/:/gslb-policies:ro
#    depends_on:
#      - git-sync
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    profiles:
     - monitoring
     - all
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    profiles:
     - monitoring
     - all
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  rabbitmq:
    image: rabbitmq:3-management
    profiles:
      - rabbitmq
      - all
    environment:
      RABBITMQ_DEFAULT_USER: devuser
      RABBITMQ_DEFAULT_PASS: devpass
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
  
  dnsdist:
    image: powerdns/dnsdist-20:latest
    profiles:
      - dnsdist
      - all
    ports: 
      - "5199:5199"
      - "5353:53"
      - "8083:8083"
    volumes:
      - ./data/dnsdist:/etc/dnsdist/
      - ./data/dnsdist/logs:/var/log/dnsdist/
  
  valkey:
    image: valkey/valkey:9.0.3-alpine
    command: >
      valkey-server /etc/valkey/valkey.conf --aclfile /etc/valkey/users.acl
    ports:
      - "6379:6379"
    volumes:
      - ./data/valkey/data:/data:rw
      - ./data/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - ./data/valkey/users.acl:/etc/valkey/users.acl:ro

volumes:
  prometheus-data:
  grafana-data: